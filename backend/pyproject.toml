[project]
name = "workplace-english"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "redis>=5.2,<7",
  "livekit-agents==1.8.2",
  "livekit-plugins-silero==1.8.2",
  "livekit-plugins-turn-detector==1.8.2",
  "livekit-api==1.2.1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["redis: requires a real Redis server", "live: uses billable LiveKit Inference"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[[tool.uv.index]]
name = "approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
